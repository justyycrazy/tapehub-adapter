[project]
name = "tapehub-tqsdk-adapter"
version = "0.1.0"
description = "TapeHub TqSdk 远程适配器"
requires-python = ">=3.12"
dependencies = [
    "tapehub-adapter-common",
    "tqsdk>=3.10,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapehub_adapter_tqsdk"]
