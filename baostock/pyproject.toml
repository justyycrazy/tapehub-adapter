[project]
name = "tapehub-baostock-adapter"
version = "0.1.0"
description = "TapeHub Baostock 远程适配器"
requires-python = ">=3.12"
dependencies = [
    "tapehub-adapter-common",
    "baostock>=0.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapehub_adapter_baostock"]
