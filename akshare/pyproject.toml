[project]
name = "tapehub-akshare-adapter"
version = "0.1.0"
description = "TapeHub AkShare 远程适配器"
requires-python = ">=3.12"
dependencies = [
    "tapehub-adapter-common",
    "akshare>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapehub_adapter_akshare"]
