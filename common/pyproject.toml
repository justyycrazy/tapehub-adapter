[project]
name = "tapehub-adapter-common"
version = "0.1.0"
description = "TapeHub 远程适配器内部协议"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapehub_adapter_common"]
